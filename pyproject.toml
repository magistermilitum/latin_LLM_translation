[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latin-rag-translator"
version = "0.1.0"
description = "RAG-based Latin to English translation pipeline using Chroma + NLLB + Qwen refinement"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Latin RAG Team" }]
license = { text = "MIT" }
dependencies = [
  "torch",
  "transformers>=4.40.0",
  "peft>=0.11.0",
  "bitsandbytes>=0.43.0",
  "langchain-chroma>=0.1.2",
  "langchain-huggingface>=0.0.3",
  "langchain-core>=0.2.0",
  "datasets>=2.18.0",
  "tqdm>=4.66.0",
  "evaluate>=0.4.1",
  "bert-score>=0.3.13",
  "numpy>=1.26.0",
  "nltk>=3.8.1",
  "comet-ml>=3.43.0",
  "unbabel-comet>=2.2.0",
  "regex>=2024.5.15"
]

[project.optional-dependencies]
cpu = [
  "torch --index-url https://download.pytorch.org/whl/cpu"
]

[project.scripts]
latin-rag-translator = "latin_rag_translator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
